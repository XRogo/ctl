<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mapa Craftly</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="pozycje.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background-color: #000;
            touch-action: none;
        }
        #map-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            background-color: #000;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
        }
        #zoom-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
        #zoom-controls button {
            display: block;
            margin: 5px;
            padding: 10px;
            font-size: 20px;
            background-color: #444;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        #zoom-controls button:hover {
            background-color: #666;
        }
        #category-controls {
            position: absolute;
            bottom: 70px;
            right: 10px;
            z-index: 10;
        }
        #category-controls button {
            display: block;
            margin: 5px;
            padding: 8px;
            font-size: 16px;
            background-color: #444;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        #category-controls button:hover {
            background-color: #666;
        }
        #category-controls button.active {
            background-color: #297008;
        }
        #toggle-webp, #add-polygon {
            position: absolute;
            z-index: 10;
            padding: 10px;
            font-size: 20px;
            background-color: #444;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        #toggle-webp {
            bottom: 10px;
            left: 10px;
        }
        #add-polygon {
            top: 10px;
            left: 10px;
        }
        #toggle-webp:hover, #add-polygon:hover {
            background-color: #666;
        }
        #zoom-display {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 5px 10px;
            font-size: 16px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }
        #coord-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 5px 10px;
            font-size: 16px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }
        #error-message {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background: rgba(200, 0, 0, 0.8);
            border-radius: 4px;
            font-family: Arial, sans-serif;
            display: none;
        }
        dialog {
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            z-index: 20;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.7);
        }
        dialog label {
            display: block;
            margin: 10px 0 5px;
            font-size: 16px;
        }
        dialog input[type="text"],
        dialog input[type="color"] {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
        }
        dialog input[type="color"] {
            height: 40px;
            padding: 4px;
        }
        dialog #color-preview {
            width: 50px;
            height: 50px;
            border: 1px solid #fff;
            border-radius: 4px;
            margin: 10px 0;
        }
        dialog textarea {
            width: 100%;
            height: 200px;
            padding: 8px;
            font-size: 14px;
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            resize: none;
        }
        dialog button {
            margin: 10px 5px 0;
            padding: 8px 16px;
            font-size: 16px;
            background-color: #297008;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        dialog button:hover {
            background-color: #3a8c0a;
        }
        dialog button.cancel {
            background-color: #666;
        }
        dialog button.cancel:hover {
            background-color: #888;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <canvas id="map"></canvas>
    </div>
    <div id="zoom-controls">
        <button id="zoom-in">+</button>
        <button id="zoom-out">-</button>
    </div>
    <div id="category-controls">
        <!-- Przyciski kategorii będą generowane dynamicznie -->
    </div>
    <button id="toggle-webp">🔒</button>
    <button id="add-polygon">+</button>
    <div id="zoom-display">Zoom: 1.0x</div>
    <div id="coord-display">X: 0, Z: 0</div>
    <div id="error-message"></div>
    <dialog id="polygon-form">
        <form>
            <label for="polygon-name">Nazwa:</label>
            <input type="text" id="polygon-name" required>
            <label for="polygon-color">Kolor:</label>
            <input type="color" id="polygon-color" required>
            <div id="color-preview"></div>
            <button type="submit">Dodaj</button>
            <button type="button" class="cancel" onclick="document.getElementById('polygon-form').close()">Anuluj</button>
        </form>
    </dialog>
    <dialog id="polygon-result">
        <form>
            <label for="polygon-json">Wygenerowany kod:</label>
            <textarea id="polygon-json" readonly></textarea>
            <button type="button" onclick="navigator.clipboard.writeText(document.getElementById('polygon-json').value).then(() => alert('Skopiowano do schowka!'))">Kopiuj</button>
            <button type="button" class="cancel" onclick="document.getElementById('polygon-result').close()">Zamknij</button>
        </form>
    </dialog>

    <script>
        const PNG_SIZE = 2000;
        const WEBP_SIZE = 7612;
        const imagePath = 'kafelki/';
        const tiles = ['0,0', '0,-0', '-0,0', '-0,-0'];
        const minZoom = 0.1;
        const maxZoom = 50;
        const touchThreshold = 200; // Czas w ms dla krótkiego dotknięcia (dodanie punktu)

        function parseCoord(str, isWebP = false) {
            const size = isWebP ? WEBP_SIZE : PNG_SIZE;
            if (str === '0') return 0;
            if (str === '-0') return -size;
            return parseInt(str, 10) > 0 ? parseInt(str, 10) * size : (parseInt(str, 10) - 1) * size;
        }

        function getTileKey(x, y) {
            return `${x},${y}`;
        }

        function calculateCentroid(points) {
            let xSum = 0, zSum = 0;
            points.forEach(([x, z]) => {
                xSum += x;
                zSum += z;
            });
            const count = points.length;
            return count > 0 ? [xSum / count, zSum / count] : [0, 0];
        }

        function calculateLineMidpoint(points) {
            if (points.length < 2) return points[0] || [0, 0];
            let totalLength = 0;
            const lengths = [];
            for (let i = 1; i < points.length; i++) {
                const [x1, z1] = points[i - 1];
                const [x2, z2] = points[i];
                const segmentLength = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
                lengths.push(segmentLength);
                totalLength += segmentLength;
            }
            const halfLength = totalLength / 2;
            let accumulatedLength = 0;
            for (let i = 0; i < lengths.length; i++) {
                accumulatedLength += lengths[i];
                if (accumulatedLength >= halfLength) {
                    const [x1, z1] = points[i];
                    const [x2, z2] = points[i + 1];
                    const ratio = (halfLength - (accumulatedLength - lengths[i])) / lengths[i];
                    return [
                        x1 + (x2 - x1) * ratio,
                        z1 + (z2 - z1) * ratio
                    ];
                }
            }
            return points[Math.floor(points.length / 2)];
        }

        function calculateLineAngle(points) {
            if (points.length < 2) return 0;
            let totalLength = 0;
            const lengths = [];
            for (let i = 1; i < points.length; i++) {
                const [x1, z1] = points[i - 1];
                const [x2, z2] = points[i];
                const segmentLength = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
                lengths.push(segmentLength);
                totalLength += segmentLength;
            }
            const halfLength = totalLength / 2;
            let accumulatedLength = 0;
            for (let i = 0; i < lengths.length; i++) {
                accumulatedLength += lengths[i];
                if (accumulatedLength >= halfLength) {
                    const [x1, z1] = points[i];
                    const [x2, z2] = points[i + 1];
                    const dx = x2 - x1;
                    const dz = z2 - z1;
                    let angle = Math.atan2(dz, dx);
                    if (angle > Math.PI / 2) {
                        angle -= Math.PI;
                    } else if (angle < -Math.PI / 2) {
                        angle += Math.PI;
                    }
                    return angle;
                }
            }
            return 0;
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b];
        }

        function formatPolygonJSON(polygon) {
            const pointsStr = JSON.stringify(polygon.points);
            return `{
    points: ${pointsStr},
    lineColor: '${polygon.lineColor}',
    fillColor: '${polygon.fillColor}',
    closePath: ${polygon.closePath},
    name: '${polygon.name}',
    category: ${polygon.category}
},`;
        }

        class TileMap {
            constructor(container) {
                this.container = container;
                this.canvas = document.getElementById('map');
                this.ctx = this.canvas.getContext('2d');
                this.ctx.imageSmoothingEnabled = false;
                this.ctx.mozImageSmoothingEnabled = false;
                this.ctx.webkitImageSmoothingEnabled = false;
                this.ctx.msImageSmoothingEnabled = false;
                this.ctx.imageSmoothingQuality = 'low';
                this.images = { png: new Map(), webp: new Map() };
                this.loadWebPEnabled = false;
                this.zoom = 1;
                this.posX = 0;
                this.posY = 0;
                this.dragging = false;
                this.startX = 0;
                this.startY = 0;
                this.touchStartTime = 0;
                this.initialPinchDistance = null;
                this.initialZoom = this.zoom;
                this.lastTouchTime = 0;
                this.needsRedraw = true;
                this.lastPosX = 0;
                this.lastPosY = 0;
                this.lastZoom = 1;
                this.zoomDisplay = document.getElementById('zoom-display');
                this.coordDisplay = document.getElementById('coord-display');
                this.errorMessage = document.getElementById('error-message');
                this.polygons = [];
                this.visibleCategories = {};
                this.ctrlPressed = false;
                this.isDrawing = false;
                this.tempPolygon = { points: [], lineColor: 'red', fillColor: 'rgba(255, 0, 0, 0)', closePath: false, name: '' };
                this.polygonForm = document.getElementById('polygon-form');
                this.polygonResult = document.getElementById('polygon-result');
                this.addPolygonBtn = document.getElementById('add-polygon');
                this.colorInput = document.getElementById('polygon-color');
                this.colorPreview = document.getElementById('color-preview');

                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                this.loadImages();
                this.loadPositions();
                this.setupPolygonForm();

                this.toggleButton = document.getElementById('toggle-webp');
                this.toggleButton.addEventListener('click', () => this.toggleWebP());

                this.setupEvents();

                requestAnimationFrame(() => this.render());
            }

            loadImages() {
                tiles.forEach(key => {
                    const [x, y] = key.split(',');
                    const img = new Image();
                    img.src = `${imagePath}${key}.png`;
                    img.onload = () => {
                        this.needsRedraw = true;
                        this.render();
                    };
                    img.onerror = () => {
                        this.errorMessage.textContent = `Błąd ładowania kafelka PNG: ${key}`;
                        this.errorMessage.style.display = 'block';
                    };
                    this.images.png.set(key, img);
                });
            }

            loadWebP() {
                if (this.loadWebPEnabled) {
                    const loadWebPSequentially = (index = 0) => {
                        if (index >= tiles.length) {
                            this.needsRedraw = true;
                            this.render();
                            return;
                        }
                        const key = tiles[index];
                        const [x, y] = key.split(',');
                        const img = new Image();
                        img.src = `${imagePath}${key}.webp`;
                        img.onload = () => {
                            this.images.webp.set(key, img);
                            this.needsRedraw = true;
                            this.render();
                            loadWebPSequentially(index + 1);
                        };
                        img.onerror = () => {
                            this.errorMessage.textContent = `Błąd ładowania kafelka WebP: ${key}`;
                            this.errorMessage.style.display = 'block';
                            loadWebPSequentially(index + 1);
                        };
                    };
                    loadWebPSequentially();
                }
            }

            loadPositions() {
                try {
                    if (typeof polygons === 'undefined' || !Array.isArray(polygons)) {
                        throw new Error('Zmienna "polygons" nie jest zdefiniowana lub nie jest tablicą');
                    }
                    this.polygons = polygons;
                    this.visibleCategories = { '1': true, '2': true, '3': true };
                    this.polygons.forEach(polygon => {
                        if (polygon.category && this.visibleCategories[polygon.category] === undefined) {
                            this.visibleCategories[polygon.category] = true;
                        }
                    });
                    this.updateCategoryControls();
                    this.centerOnOrigin();
                    this.needsRedraw = true;
                    this.render();
                } catch (e) {
                    console.error('Błąd ładowania pozycje.js:', e.message);
                    this.polygons = [];
                    this.visibleCategories = { '1': true, '2': true, '3': true };
                    this.updateCategoryControls();
                    this.centerOnOrigin();
                    this.errorMessage.textContent = 'Nie udało się załadować danych poligonów z pozycje.js';
                    this.errorMessage.style.display = 'block';
                    this.needsRedraw = true;
                    this.render();
                }
            }

            updateCategoryControls() {
                const categoryControls = document.getElementById('category-controls');
                categoryControls.innerHTML = '';
                const categoryNames = {
                    '1': 'Zajęty teren',
                    '2': 'Drogi',
                    '3': 'Linie kolejowe'
                };
                Object.keys(this.visibleCategories).forEach(category => {
                    const button = document.createElement('button');
                    button.textContent = categoryNames[category] || `Kategoria ${category}`;
                    button.className = this.visibleCategories[category] ? 'active' : '';
                    button.addEventListener('click', () => {
                        this.visibleCategories[category] = !this.visibleCategories[category];
                        button.className = this.visibleCategories[category] ? 'active' : '';
                        this.needsRedraw = true;
                        this.render();
                    });
                    categoryControls.appendChild(button);
                });
            }

            toggleWebP() {
                if (!this.loadWebPEnabled) {
                    const confirmLoad = confirm("Włączenie tej funkcji pozwoli wyświetlić całą mapę, ale strona będzie bardzo zasoborzerna");
                    if (confirmLoad) {
                        this.loadWebPEnabled = true;
                        this.toggleButton.textContent = '🔓';
                        this.loadWebP();
                    }
                } else {
                    this.loadWebPEnabled = false;
                    this.toggleButton.textContent = '🔒';
                    this.images.webp.clear();
                    this.needsRedraw = true;
                    this.render();
                    if (window.gc) window.gc();
                }
            }

            resizeCanvas() {
                const pixelRatio = window.devicePixelRatio || 1;
                this.canvas.width = window.innerWidth * pixelRatio;
                this.canvas.height = window.innerHeight * pixelRatio;
                this.canvas.style.width = window.innerWidth + 'px';
                this.canvas.style.height = window.innerHeight + 'px';
                this.ctx.imageSmoothingEnabled = false;
                this.ctx.imageSmoothingQuality = 'low';
                this.centerOnOrigin();
                this.needsRedraw = true;
            }

            centerOnOrigin() {
                this.posX = this.canvas.width / 2;
                this.posY = this.canvas.height / 2;
                this.lastPosX = this.posX;
                this.lastPosY = this.posY;
                this.coordDisplay.textContent = `X: 0, Z: 0`;
            }

            setupPolygonForm() {
                this.colorInput.addEventListener('input', () => {
                    this.colorPreview.style.backgroundColor = this.colorInput.value;
                });

                this.addPolygonBtn.addEventListener('click', () => {
                    if (this.isDrawing) {
                        if (this.tempPolygon.points.length < 3) {
                            this.errorMessage.textContent = 'Poligon musi mieć co najmniej 3 punkty!';
                            this.errorMessage.style.display = 'block';
                            setTimeout(() => { this.errorMessage.style.display = 'none'; }, 3000);
                            return;
                        }
                        this.isDrawing = false;
                        this.addPolygonBtn.textContent = '+';
                        const polygon = {
                            points: this.tempPolygon.points,
                            lineColor: this.tempPolygon.lineColor,
                            fillColor: this.tempPolygon.fillColor,
                            closePath: true,
                            name: this.tempPolygon.name,
                            category: 1
                        };
                        this.polygons.push(polygon);
                        if (this.visibleCategories[1] === undefined) {
                            this.visibleCategories[1] = true;
                            this.updateCategoryControls();
                        }
                        const jsonOutput = formatPolygonJSON(polygon);
                        document.getElementById('polygon-json').value = jsonOutput;
                        this.polygonResult.showModal();
                        this.tempPolygon = { points: [], lineColor: 'red', fillColor: 'rgba(255, 0, 0, 0)', closePath: false, name: '' };
                        this.needsRedraw = true;
                        this.render();
                    } else {
                        this.polygonForm.showModal();
                    }
                });

                this.polygonForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('polygon-name').value.trim();
                    const color = this.colorInput.value;
                    if (!name) {
                        this.errorMessage.textContent = 'Wprowadź poprawną nazwę!';
                        this.errorMessage.style.display = 'block';
                        setTimeout(() => { this.errorMessage.style.display = 'none'; }, 3000);
                        return;
                    }
                    const [r, g, b] = hexToRgb(color);
                    this.tempPolygon.name = name;
                    this.tempPolygon.lineColor = `rgba(${r}, ${g}, ${b}, 1)`;
                    this.tempPolygon.fillColor = `rgba(${r}, ${g}, ${b}, 0.2)`;
                    this.isDrawing = true;
                    this.addPolygonBtn.textContent = '✅';
                    this.polygonForm.close();
                    this.colorPreview.style.backgroundColor = '';
                    this.needsRedraw = true;
                    this.render();
                });
            }

            getTouchDistance(touches) {
                if (touches.length < 2) return null;
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            getTouchCenter(touches) {
                if (touches.length < 2) {
                    return {
                        x: touches[0].clientX,
                        y: touches[0].clientY
                    };
                }
                return {
                    x: (touches[0].clientX + touches[1].clientX) / 2,
                    y: (touches[0].clientY + touches[1].clientY) / 2
                };
            }

            setupEvents() {
                const zoomInBtn = document.getElementById('zoom-in');
                const zoomOutBtn = document.getElementById('zoom-out');

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Control') {
                        this.ctrlPressed = true;
                    }
                });
                document.addEventListener('keyup', (e) => {
                    if (e.key === 'Control') {
                        this.ctrlPressed = false;
                    }
                });

                zoomInBtn.addEventListener('click', () => {
                    this.setZoom(this.zoom + (this.ctrlPressed ? 1 : 0.1));
                });

                zoomOutBtn.addEventListener('click', () => {
                    this.setZoom(this.zoom - (this.ctrlPressed ? 1 : 0.1));
                });

                this.container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const delta = e.deltaY < 0 ? 1 : -1;
                    const zoomDelta = this.ctrlPressed ? delta : delta * 0.1;
                    this.setZoom(this.zoom + zoomDelta, mouseX, mouseY);
                });

                this.container.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const worldX = Math.round((mouseX - this.posX) / this.zoom);
                    const worldZ = Math.round((mouseY - this.posY) / this.zoom);

                    if (e.button === 2 && this.isDrawing) {
                        e.preventDefault();
                        let pointRemoved = false;
                        const clickRadius = 5 / this.zoom;
                        this.tempPolygon.points = this.tempPolygon.points.filter(([x, z]) => {
                            const dx = worldX - x;
                            const dz = worldZ - z;
                            const distance = Math.sqrt(dx * dx + dz * dz);
                            if (distance < clickRadius) {
                                pointRemoved = true;
                                return false;
                            }
                            return true;
                        });

                        if (pointRemoved) {
                            this.needsRedraw = true;
                            this.render();
                            return;
                        }

                        this.tempPolygon.points.push([worldX, worldZ]);
                        this.needsRedraw = true;
                        this.render();
                    } else if (e.button === 0) {
                        this.dragging = true;
                        this.startX = e.clientX;
                        this.startY = e.clientY;
                        this.container.style.cursor = 'grabbing';
                    }
                });

                this.container.addEventListener('contextmenu', (e) => {
                    if (this.isDrawing) {
                        e.preventDefault();
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.dragging) {
                        this.posX += e.clientX - this.startX;
                        this.posY += e.clientY - this.startY;
                        this.startX = e.clientX;
                        this.startY = e.clientY;
                        this.clampPosition();
                        this.needsRedraw = true;
                    }
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const worldX = Math.round((mouseX - this.posX) / this.zoom);
                    const worldZ = Math.round((mouseY - this.posY) / this.zoom);
                    this.coordDisplay.textContent = `X: ${worldX}, Z: ${worldZ}`;
                });

                document.addEventListener('mouseup', () => {
                    this.dragging = false;
                    this.container.style.cursor = 'grab';
                });

                this.container.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    if (e.touches.length === 1) {
                        this.touchStartTime = Date.now();
                        this.startX = e.touches[0].clientX;
                        this.startY = e.touches[0].clientY;
                        this.dragging = false;
                    } else if (e.touches.length === 2) {
                        this.dragging = false;
                        this.initialPinchDistance = this.getTouchDistance(e.touches);
                        this.initialZoom = this.zoom;
                        const center = this.getTouchCenter(e.touches);
                        this.startX = center.x;
                        this.startY = center.y;
                    }
                });

                this.container.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    if (e.touches.length === 1) {
                        const deltaX = e.touches[0].clientX - this.startX;
                        const deltaY = e.touches[0].clientY - this.startY;
                        this.posX += deltaX;
                        this.posY += deltaY;
                        this.startX = e.touches[0].clientX;
                        this.startY = e.touches[0].clientY;
                        this.dragging = true;
                        this.clampPosition();
                        this.needsRedraw = true;
                        const mouseX = e.touches[0].clientX - rect.left;
                        const mouseY = e.touches[0].clientY - rect.top;
                        const worldX = Math.round((mouseX - this.posX) / this.zoom);
                        const worldZ = Math.round((mouseY - this.posY) / this.zoom);
                        this.coordDisplay.textContent = `X: ${worldX}, Z: ${worldZ}`;
                    } else if (e.touches.length === 2) {
                        const currentDistance = this.getTouchDistance(e.touches);
                        if (this.initialPinchDistance && currentDistance) {
                            const scale = currentDistance / this.initialPinchDistance;
                            const center = this.getTouchCenter(e.touches);
                            const centerX = center.x - rect.left;
                            const centerY = center.y - rect.top;
                            this.setZoom(this.initialZoom * scale, centerX, centerY);
                            this.initialPinchDistance = currentDistance;
                            this.needsRedraw = true;
                        }
                    }
                    this.render();
                });

                this.container.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const touchDuration = Date.now() - this.touchStartTime;
                    if (e.changedTouches.length === 1 && touchDuration < touchThreshold && this.isDrawing) {
                        const touchX = e.changedTouches[0].clientX - rect.left;
                        const touchY = e.changedTouches[0].clientY - rect.top;
                        const worldX = Math.round((touchX - this.posX) / this.zoom);
                        const worldZ = Math.round((touchY - this.posY) / this.zoom);
                        this.tempPolygon.points.push([worldX, worldZ]);
                        this.needsRedraw = true;
                        this.render();
                    } else if (e.changedTouches.length === 1 && this.isDrawing && this.lastTouchTime && Date.now() - this.lastTouchTime < 300) {
                        const touchX = e.changedTouches[0].clientX - rect.left;
                        const touchY = e.changedTouches[0].clientY - rect.top;
                        const worldX = Math.round((touchX - this.posX) / this.zoom);
                        const worldZ = Math.round((touchY - this.posY) / this.zoom);
                        let pointRemoved = false;
                        const clickRadius = 5 / this.zoom;
                        this.tempPolygon.points = this.tempPolygon.points.filter(([x, z]) => {
                            const dx = worldX - x;
                            const dz = worldZ - z;
                            const distance = Math.sqrt(dx * dx + dz * dz);
                            if (distance < clickRadius) {
                                pointRemoved = true;
                                return false;
                            }
                            return true;
                        });
                        if (pointRemoved) {
                            this.needsRedraw = true;
                            this.render();
                        }
                    }
                    this.lastTouchTime = Date.now();
                    this.dragging = false;
                    this.initialPinchDistance = null;
                    this.container.style.cursor = 'grab';
                });
            }

            setZoom(newZoom, centerX = this.canvas.width / 2, centerY = this.canvas.height / 2) {
                const prevZoom = this.zoom;
                newZoom = Math.max(minZoom, Math.min(maxZoom, newZoom));
                if (newZoom === this.zoom) return;

                const worldX = (centerX - this.posX) / prevZoom;
                const worldY = (centerY - this.posY) / prevZoom;
                this.zoom = newZoom;
                this.posX = centerX - worldX * newZoom;
                this.posY = centerY - worldY * newZoom;
                this.clampPosition();
                this.needsRedraw = true;
                this.zoomDisplay.textContent = `Zoom: ${this.zoom.toFixed(1)}x`;
            }

            getMapBounds() {
                let minX = 0, maxX = 0, minY = 0, maxY = 0;
                tiles.forEach(key => {
                    const [x, y] = key.split(',');
                    const posX = parseCoord(x, this.loadWebPEnabled);
                    const posY = parseCoord(y, this.loadWebPEnabled);
                    const size = this.loadWebPEnabled ? WEBP_SIZE : PNG_SIZE;
                    minX = Math.min(minX, posX);
                    maxX = Math.max(maxX, posX + size);
                    minY = Math.min(minY, posY);
                    maxY = Math.max(maxY, posY + size);
                });
                return { minX, maxX, minY, maxY };
            }

            clampPosition() {
                const { minX, maxX, minY, maxY } = this.getMapBounds();
                const viewWidth = this.canvas.width / this.zoom;
                const viewHeight = this.canvas.height / this.zoom;
                const minPosX = -(maxX * this.zoom - 1);
                const maxPosX = this.canvas.width - (minX * this.zoom + 1);
                const minPosY = -(maxY * this.zoom - 1);
                const maxPosY = this.canvas.height - (minY * this.zoom + 1);
                this.posX = Math.max(minPosX, Math.min(maxPosX, this.posX));
                this.posY = Math.max(minPosY, Math.min(maxPosY, this.posY));
            }

            isVisible(x, y, width, height) {
                const viewWidth = this.canvas.width / this.zoom;
                const viewHeight = this.canvas.height / this.zoom;
                const viewLeft = -this.posX / this.zoom;
                const viewRight = viewLeft + viewWidth;
                const viewTop = -this.posY / this.zoom;
                const viewBottom = viewTop + viewHeight;
                return x < viewRight && x + width > viewLeft && y < viewBottom && y + height > viewTop;
            }

            render() {
                if (!this.needsRedraw && this.posX === this.lastPosX && this.posY === this.lastPosY && this.zoom === this.lastZoom) {
                    requestAnimationFrame(() => this.render());
                    return;
                }

                this.needsRedraw = false;
                this.lastPosX = this.posX;
                this.lastPosY = this.posY;
                this.lastZoom = this.zoom;

                const pixelRatio = window.devicePixelRatio || 1;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.save();
                const pixelPerfectX = Math.round(this.posX * pixelRatio) / pixelRatio;
                const pixelPerfectY = Math.round(this.posY * pixelRatio) / pixelRatio;
                this.ctx.translate(pixelPerfectX, pixelPerfectY);
                this.ctx.scale(this.zoom, this.zoom);
                this.ctx.imageSmoothingEnabled = false;
                this.ctx.imageSmoothingQuality = 'low';

                if (this.loadWebPEnabled) {
                    tiles.forEach(key => {
                        const [x, y] = key.split(',');
                        const img = this.images.webp.get(key);
                        const posX = parseCoord(x, true);
                        const posY = parseCoord(y, true);
                        if (img && img.complete && img.naturalWidth > 0 && this.isVisible(posX, posY, WEBP_SIZE, WEBP_SIZE)) {
                            const pixelPerfectPosX = Math.round(posX * pixelRatio) / pixelRatio;
                            const pixelPerfectPosY = Math.round(posY * pixelRatio) / pixelRatio;
                            this.ctx.imageSmoothingEnabled = false;
                            this.ctx.drawImage(img, pixelPerfectPosX, pixelPerfectPosY, WEBP_SIZE, WEBP_SIZE);
                        }
                    });
                }

                tiles.forEach(key => {
                    const [x, y] = key.split(',');
                    const img = this.images.png.get(key);
                    const posX = parseCoord(x, false);
                    const posY = parseCoord(y, false);
                    if (img && img.complete && img.naturalWidth > 0 && this.isVisible(posX, posY, PNG_SIZE, PNG_SIZE)) {
                        const pixelPerfectPosX = Math.round(posX * pixelRatio) / pixelRatio;
                        const pixelPerfectPosY = Math.round(posY * pixelRatio) / pixelRatio;
                        this.ctx.imageSmoothingEnabled = false;
                        this.ctx.drawImage(img, pixelPerfectPosX, pixelPerfectPosY, PNG_SIZE, PNG_SIZE);
                    }
                });

                if (this.polygons && this.polygons.length > 0) {
                    this.polygons.forEach((polygon, index) => {
                        if (this.visibleCategories[polygon.category] && polygon.points && polygon.points.length > 0 && (polygon.category !== 2 || this.zoom >= 2.9)) {
                            const { points, lineColor, fillColor, closePath, name, category } = polygon;
                            this.ctx.beginPath();
                            points.forEach((p, i) => {
                                const [x, z] = p;
                                if (i === 0) {
                                    this.ctx.moveTo(x, z);
                                } else {
                                    this.ctx.lineTo(x, z);
                                }
                            });
                            if (closePath && category === 1) {
                                this.ctx.closePath();
                            }
                            this.ctx.fillStyle = category === 1 ? fillColor : 'rgba(0, 0, 0, 0)';
                            this.ctx.fill();
                            this.ctx.strokeStyle = lineColor;
                            this.ctx.lineWidth = category === 1 ? 2 / this.zoom : (category === 2 ? 6 / this.zoom : 3 / this.zoom);
                            this.ctx.stroke();

                            if (name && (category === 1 || this.zoom > 2)) {
                                const [centerX, centerZ] = category === 1 ? calculateCentroid(points) : calculateLineMidpoint(points);
                                this.ctx.font = `${12 / this.zoom}px Arial`;
                                this.ctx.fillStyle = 'white';
                                this.ctx.strokeStyle = 'black';
                                this.ctx.lineWidth = 0.5 / this.zoom;
                                this.ctx.textAlign = 'center';
                                this.ctx.textBaseline = 'middle';
                                if (category !== 1) {
                                    const angle = calculateLineAngle(points);
                                    this.ctx.save();
                                    this.ctx.translate(centerX, centerZ);
                                    this.ctx.rotate(angle);
                                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                                    this.ctx.shadowBlur = 4 / this.zoom;
                                    this.ctx.shadowOffsetX = 2 / this.zoom;
                                    this.ctx.shadowOffsetY = 2 / this.zoom;
                                    this.ctx.strokeText(name, 0, 0);
                                    this.ctx.fillText(name, 0, 0);
                                    this.ctx.shadowColor = 'transparent';
                                    this.ctx.shadowBlur = 0;
                                    this.ctx.restore();
                                } else {
                                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                                    this.ctx.shadowBlur = 4 / this.zoom;
                                    this.ctx.shadowOffsetX = 2 / this.zoom;
                                    this.ctx.shadowOffsetY = 2 / this.zoom;
                                    this.ctx.strokeText(name, centerX, centerZ);
                                    this.ctx.fillText(name, centerX, centerZ);
                                    this.ctx.shadowColor = 'transparent';
                                    this.ctx.shadowBlur = 0;
                                }
                            }
                        }
                    });
                }

                if (this.isDrawing && this.tempPolygon.points.length > 0) {
                    this.ctx.beginPath();
                    this.tempPolygon.points.forEach((p, i) => {
                        const [x, z] = p;
                        if (i === 0) {
                            this.ctx.moveTo(x, z);
                        } else {
                            this.ctx.lineTo(x, z);
                        }
                    });
                    this.ctx.strokeStyle = 'red';
                    this.ctx.lineWidth = 2 / this.zoom;
                    this.ctx.stroke();

                    this.tempPolygon.points.forEach(([x, z]) => {
                        this.ctx.beginPath();
                        this.ctx.arc(x, z, 3 / this.zoom, 0, 2 * Math.PI);
                        this.ctx.fillStyle = 'red';
                        this.ctx.fill();
                    });
                }

                this.ctx.restore();

                requestAnimationFrame(() => this.render());
            }
        }

        const tileMap = new TileMap(document.getElementById('map-container'));
    </script>
